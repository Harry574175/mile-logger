<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mileage Logger</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Mileage Logger</h1>

    <div class="form">
        <label>Date:</label>
        <input type="date" id="date">

        <label>Period:</label>
        <select id="period">
            <option value="Morning">Morning</option>
            <option value="Afternoon">Afternoon</option>
            <option value="Evening">Evening</option>
        </select>

        <label>Start Postcode:</label>
        <input type="text" id="start">
        <button id="start-show-btn">Show Saved</button>
        <ul id="start-saved-list" class="saved-list"></ul>

        <label>Destination Postcode:</label>
        <input type="text" id="destination">
        <button id="destination-show-btn">Show Saved</button>
        <ul id="destination-saved-list" class="saved-list"></ul>

        <label>Your Name:</label>
        <input type="text" id="logger-name">

        <button id="log-trip-btn">Log Trip</button>
        <p id="output"></p>
    </div>

    <h2>Logged Trips</h2>
    <table id="trip-log"></table>

    <button id="export-csv-btn">Export CSV</button>
    <button id="clear-all-btn">Clear All</button>

    <div id="delete-popup" class="hidden popup">
        <p>Delete this entry?</p>
        <button id="delete-yes">Yes</button>
        <button id="delete-no">No</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
